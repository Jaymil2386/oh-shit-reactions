name: Build and publish Oh Shit reaction GIF library

on:
  push:
    branches: [main]
    paths:
      - 'gifs/**'
      - 'publish_reactions.py'
      - 'publisher-config.json'
      - '.github/workflows/publish-reactions.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oh-shit-reaction-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reaction library
        uses: actions/checkout@v4

      - name: Check for uploaded GIFs
        id: gifs
        shell: bash
        run: |
          if find gifs -type f -iname '*.gif' -print -quit | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'GIFs found; building library.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No GIFs found in gifs/ yet. Upload at least one .gif and push to run the publisher.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.gifs.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image conversion dependency
        if: steps.gifs.outputs.present == 'true'
        run: python -m pip install 'Pillow>=11,<13'

      - name: Convert GIFs and generate library.json
        if: steps.gifs.outputs.present == 'true'
        run: python publish_reactions.py

      - name: Configure GitHub Pages
        if: steps.gifs.outputs.present == 'true'
        uses: actions/configure-pages@v5

      - name: Upload library for GitHub Pages
        if: steps.gifs.outputs.present == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy library to GitHub Pages
        if: steps.gifs.outputs.present == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
